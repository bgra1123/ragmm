[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rebalance-guard"
version = "0.1.0"
description = "MCP server: worst-case (EV@R) risk reports and stability-aware rebalancing proposals. Analysis only."
requires-python = ">=3.10"
dependencies = ["mcp>=2.0,<3", "numpy>=1.24", "pandas>=2.0", "cvxpy>=1.4"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "scikit-learn"]

[project.scripts]
rebalance-guard = "rebalance_guard.server:main"

[tool.setuptools.packages.find]
include = ["rebalance_guard*"]

[tool.setuptools.package-data]
rebalance_guard = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
