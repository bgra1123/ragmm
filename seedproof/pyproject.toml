[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seedproof"
version = "0.1.0"
description = "Measure how much your model's decisions depend on the training seed, overall and per group, and remove the part that can be removed."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Bugra Can" }]
dependencies = ["numpy>=1.24", "pandas>=1.5"]
keywords = ["machine learning", "reproducibility", "model stability", "credit scoring", "model risk"]

[project.optional-dependencies]
sklearn = ["scikit-learn>=1.2"]
boosting = ["scikit-learn>=1.2", "xgboost>=1.7", "lightgbm>=3.3"]
dev = ["pytest>=7.0", "scikit-learn>=1.2"]

[project.scripts]
seedproof = "seedproof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seedproof = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
