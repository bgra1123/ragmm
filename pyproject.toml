[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-averse-tuning"
version = "0.3.0"
description = "Risk-averse training (RA-GMM, Can & Gurbuzbalaban 2025) and retraining-tail reports for tabular models"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=1.5",
]

[project.optional-dependencies]
torch = ["torch>=2.0.0"]
dev = [
    "pytest>=7.0",
    "torch>=2.0.0",
]

[project.scripts]
ragmm = "risk_averse_tuning.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["risk_averse_tuning*"]
